<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Your Class</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
            transition: background 0.3s ease;
        }

        /* ---------- MAIN CONTAINER ---------- */
        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 50px 40px 60px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        /* ---------- TOP BAR ---------- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            font-size: 32px;
        }

        .logo span {
            background: linear-gradient(135deg, #818cf8, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px 6px 10px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(129, 140, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a5b4fc;
            font-weight: 700;
            font-size: 13px;
        }

        .user-name-text {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
        }

        .admin-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 100px;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            font-weight: 600;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            padding: 8px 14px;
            color: #f87171;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: scale(1.04);
        }

        .admin-btn {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.15);
            border-radius: 10px;
            padding: 8px 14px;
            color: #fbbf24;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .admin-btn:hover {
            background: rgba(245, 158, 11, 0.2);
            transform: scale(1.04);
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            color: #f1f5f9;
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.15);
        }

        /* ---------- HEADING ---------- */
        .heading-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .heading-section .sub-badge {
            display: inline-block;
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 6px 18px;
            border-radius: 100px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .heading-section h1 {
            font-size: 52px;
            font-weight: 900;
            color: #f1f5f9;
            letter-spacing: -1.5px;
            line-height: 1.1;
            transition: color 0.3s ease;
        }

        .heading-section h1 span {
            background: linear-gradient(135deg, #818cf8, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .heading-section p {
            color: #94a3b8;
            font-size: 18px;
            font-weight: 400;
            margin-top: 10px;
            transition: color 0.3s ease;
        }

        /* ---------- CLASS GRID ---------- */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-top: 10px;
        }

        /* ---------- CLASS CARDS (BUTTONS) ---------- */
        .class-card {
            background: rgba(40, 40, 65, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 40px 20px 36px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: block;
        }

        .class-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            padding: 2px;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .class-card:hover::before {
            opacity: 1;
        }

        .class-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 24px 60px rgba(129, 140, 248, 0.15);
        }

        .class-card:active {
            transform: scale(0.96);
        }

        /* Card Colors (per class) - Dark theme optimized */
        .class-card[data-class="9"] .card-icon { background: rgba(37, 99, 235, 0.25); color: #60a5fa; }
        .class-card[data-class="9"]:hover { border-color: #3b82f6; }

        .class-card[data-class="10"] .card-icon { background: rgba(5, 150, 105, 0.25); color: #34d399; }
        .class-card[data-class="10"]:hover { border-color: #10b981; }

        .class-card[data-class="11"] .card-icon { background: rgba(217, 119, 6, 0.25); color: #fbbf24; }
        .class-card[data-class="11"]:hover { border-color: #f59e0b; }

        .class-card[data-class="12"] .card-icon { background: rgba(124, 58, 237, 0.25); color: #a78bfa; }
        .class-card[data-class="12"]:hover { border-color: #8b5cf6; }

        /* Card Inner Elements */
        .card-icon {
            font-size: 48px;
            width: 88px;
            height: 88px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            transition: 0.3s ease;
        }

        .class-card:hover .card-icon {
            transform: scale(1.06) rotate(-2deg);
        }

        .class-card .class-number {
            font-size: 42px;
            font-weight: 900;
            color: #f1f5f9;
            letter-spacing: -1px;
            line-height: 1;
            transition: color 0.3s ease;
        }

        .class-card .class-label {
            font-size: 15px;
            font-weight: 500;
            color: #94a3b8;
            margin-top: 8px;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        /* ---------- FOOTER ---------- */
        .footer {
            text-align: center;
            margin-top: 48px;
            color: #475569;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        .footer span {
            color: #818cf8;
            font-weight: 500;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px 40px;
                border-radius: 32px;
            }

            .heading-section h1 {
                font-size: 34px;
            }

            .heading-section p {
                font-size: 16px;
            }

            .class-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .class-card {
                padding: 30px 16px 24px;
            }

            .class-card .class-number {
                font-size: 34px;
            }

            .card-icon {
                width: 72px;
                height: 72px;
                font-size: 36px;
            }

            .top-bar {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .top-bar-right {
                width: 100%;
                justify-content: flex-end;
            }

            .top-bar-left {
                width: 100%;
                justify-content: space-between;
            }

            .user-info {
                padding: 4px 10px 4px 8px;
            }

            .user-name-text {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .class-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .heading-section h1 {
                font-size: 28px;
            }

            .container {
                padding: 20px 14px 30px;
                border-radius: 24px;
            }

            .class-card .class-number {
                font-size: 28px;
            }

            .card-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .class-card {
                padding: 24px 12px 20px;
            }

            .user-name-text {
                font-size: 11px;
            }

            .logout-btn, .admin-btn {
                font-size: 11px;
                padding: 6px 10px;
            }
        }

        /* ---------- LIGHT THEME ---------- */
        body.light-theme {
            background: linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 50%, #fce4ec 100%);
        }

        body.light-theme .container {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.10), 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        body.light-theme .logo {
            color: #1a1a2e;
        }
        body.light-theme .logo span {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.light-theme .heading-section h1 {
            color: #1a1a2e;
        }
        body.light-theme .heading-section h1 span {
            background: linear-gradient(135deg, #4f46e5, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.light-theme .heading-section p {
            color: #6b7280;
        }
        body.light-theme .heading-section .sub-badge {
            background: rgba(79, 70, 229, 0.12);
            color: #4f46e5;
        }

        body.light-theme .class-card {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }

        body.light-theme .class-card .class-number {
            color: #1a1a2e;
        }
        body.light-theme .class-card .class-label {
            color: #6b7280;
        }

        body.light-theme .class-card[data-class="9"] .card-icon { background: #dbeafe; color: #2563eb; }
        body.light-theme .class-card[data-class="10"] .card-icon { background: #d1fae5; color: #059669; }
        body.light-theme .class-card[data-class="11"] .card-icon { background: #fef3c7; color: #d97706; }
        body.light-theme .class-card[data-class="12"] .card-icon { background: #ede9fe; color: #7c3aed; }

        body.light-theme .footer {
            color: #9ca3af;
        }
        body.light-theme .footer span {
            color: #4f46e5;
        }

        body.light-theme .theme-toggle {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
            color: #1a1a2e;
        }
        body.light-theme .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        body.light-theme .logout-btn {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.15);
            color: #dc2626;
        }

        body.light-theme .logout-btn:hover {
            background: rgba(239, 68, 68, 0.15);
        }

        body.light-theme .admin-btn {
            background: rgba(245, 158, 11, 0.08);
            border-color: rgba(245, 158, 11, 0.15);
            color: #d97706;
        }

        body.light-theme .admin-btn:hover {
            background: rgba(245, 158, 11, 0.15);
        }

        body.light-theme .user-info {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.06);
        }

        body.light-theme .user-name-text {
            color: #4b5563;
        }

        body.light-theme .user-avatar {
            background: rgba(79, 70, 229, 0.1);
            color: #4f46e5;
        }

        body.light-theme .admin-badge {
            background: rgba(245, 158, 11, 0.1);
            color: #d97706;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== TOP BAR ===== -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="logo">
                    <span class="logo-icon">📚</span>
                    <span>LearnEasy</span>
                </div>
                <div class="user-info">
                    <span class="user-avatar" id="userAvatar">👤</span>
                    <span class="user-name-text" id="userNameDisplay">Guest</span>
                    <span class="admin-badge" id="adminBadge" style="display:none;">👑 Admin</span>
                </div>
            </div>
            <div class="top-bar-right">
                <button class="admin-btn" id="adminPanelBtn" title="Admin Panel">🛡️ Admin</button>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
                <button class="theme-toggle" id="themeToggle" title="Toggle Theme">☀️</button>
            </div>
        </div>

        <!-- ===== HEADING ===== -->
        <div class="heading-section">
            <div class="sub-badge">✨ Choose Your Path</div>
            <h1>Select Your <span>Class</span></h1>
            <p>Pick your grade to start learning</p>
        </div>

        <!-- ===== CLASS GRID ===== -->
        <div class="class-grid">

            <!-- Class 9 -->
            <a href="#" class="class-card" data-class="9">
                <div class="card-icon">📘</div>
                <div class="class-number">9</div>
                <div class="class-label">Foundation</div>
            </a>

            <!-- Class 10 -->
            <a href="#" class="class-card" data-class="10">
                <div class="card-icon">📗</div>
                <div class="class-number">10</div>
                <div class="class-label">Board Prep</div>
            </a>

            <!-- Class 11 -->
            <a href="#" class="class-card" data-class="11">
                <div class="card-icon">📕</div>
                <div class="class-number">11</div>
                <div class="class-label">Stream Choice</div>
            </a>

            <!-- Class 12 -->
            <a href="#" class="class-card" data-class="12">
                <div class="card-icon">📙</div>
                <div class="class-number">12</div>
                <div class="class-label">Final Sprint</div>
            </a>

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            — by <span>Sultan</span>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ============================================================
        // 1. DIRECT ACCESS PROTECTION - Agar login nahi hai to login page pe bhejo
        // ============================================================
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const loginTime = parseInt(localStorage.getItem('loginTime') || '0');
        const SESSION_DURATION = 24 * 60 * 60 * 1000;

        // Agar login nahi hai ya session expired hai to login page pe bhejo
        if (!isLoggedIn || (Date.now() - loginTime) > SESSION_DURATION) {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('loginTime');
            window.location.href = 'login.html';
        }

        // ============================================================
        // 2. DISPLAY USER NAME
        // ============================================================
        const userName = localStorage.getItem('userName') || 'Guest';
        const isAdmin = localStorage.getItem('isAdmin') === 'true';

        document.getElementById('userNameDisplay').textContent = userName;

        const avatar = document.getElementById('userAvatar');
        avatar.textContent = userName.charAt(0).toUpperCase();

        if (isAdmin) {
            document.getElementById('adminBadge').style.display = 'inline-block';
        }

        // ============================================================
        // 3. THEME TOGGLE
        // ============================================================
        const themeToggle = document.getElementById('themeToggle');
        let isDark = true;

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            isDark = false;
            document.body.classList.add('light-theme');
            themeToggle.textContent = '🌙';
        }

        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            const body = document.body;

            if (isDark) {
                body.classList.remove('light-theme');
                themeToggle.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.add('light-theme');
                themeToggle.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        });

        // ============================================================
        // 4. LOGOUT FUNCTION
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('loginTime');
                window.location.href = 'login.html';
            }
        });

        // ============================================================
        // 5. ADMIN PANEL BUTTON
        // ============================================================
        document.getElementById('adminPanelBtn').addEventListener('click', () => {
            window.location.href = 'admin_panel.html';
        });

        // ============================================================
        // 6. CLASS CARD CLICK - Navigate to Subject Page
        // ============================================================
        //document.querySelectorAll('.class-card').forEach(card => {
          //  card.addEventListener('click', (e) => {
            //    e.preventDefault();
              //  const cls = card.getAttribute('data-class');
                
             //   const urls = {
               //     '9': 'class9_subjects.html',
                 //   '10': 'class10_subjects.html',
                   // '11': 'class11_subjects.html',
                    //'12': 'class12_subjects.html'
            //    };
                
           //     window.location.href = urls[cls];
            //});
       // });
        // ============================================================
        // ============================================================
        // 7. ADMIN ACCESS (Secret Shortcut - Ctrl+Shift+A)
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
                window.location.href = 'admin_panel.html';
            }
        });

        // ============================================================
        // 8. CONSOLE WARNING (Security)
        // ============================================================
        console.log('%c🔐 Secure System Active', 'font-size:20px; font-weight:bold; color:#818cf8;');
        console.log('%c👤 Logged in as: ' + userName, 'font-size:14px; color:#34d399;');
        if (isAdmin) {
            console.log('%c👑 You are the Admin', 'font-size:14px; color:#fbbf24;');
        }
        console.log('%c💡 Admin Panel: Click "🛡️ Admin" button or press Ctrl+Shift+A', 'font-size:14px; color:#94a3b8;');
    </script>

</body>
</html>
