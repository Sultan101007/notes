<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class 10 - Subjects</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
            transition: background 0.3s ease;
        }

        /* ---------- MAIN CONTAINER ---------- */
        .container {
            width: 100%;
            max-width: 1100px;
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 40px 50px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        /* ---------- TOP BAR ---------- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 16px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
            transform: translateX(-4px);
        }

        .class-badge {
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            font-weight: 700;
            font-size: 14px;
            padding: 6px 18px;
            border-radius: 100px;
            border: 1px solid rgba(129, 140, 248, 0.2);
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            color: #f1f5f9;
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.15);
        }

        /* ---------- HEADING ---------- */
        .heading-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .heading-section .sub-badge {
            display: inline-block;
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 6px 18px;
            border-radius: 100px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .heading-section h1 {
            font-size: 44px;
            font-weight: 900;
            color: #f1f5f9;
            letter-spacing: -1.5px;
            line-height: 1.1;
            transition: color 0.3s ease;
        }

        .heading-section h1 .class-number {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .heading-section h1 .subject-text {
            background: linear-gradient(135deg, #818cf8, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .heading-section p {
            color: #94a3b8;
            font-size: 17px;
            font-weight: 400;
            margin-top: 8px;
            transition: color 0.3s ease;
        }

        /* ---------- SUBJECT GRID ---------- */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 10px;
        }

        /* ---------- SUBJECT CARDS ---------- */
        .subject-card {
            background: rgba(40, 40, 65, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 24px;
            padding: 40px 20px 32px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: block;
        }

        .subject-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .subject-card:hover::before {
            opacity: 1;
        }

        .subject-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 24px 60px rgba(129, 140, 248, 0.12);
        }

        .subject-card:active {
            transform: scale(0.96);
        }

        /* Subject Card Colors */
        .subject-card[data-subject="science"] .card-icon { 
            background: rgba(16, 185, 129, 0.2); 
            color: #34d399; 
        }
        .subject-card[data-subject="science"]:hover { 
            border-color: #10b981; 
        }

        /* Card Inner Elements */
        .card-icon {
            font-size: 52px;
            width: 96px;
            height: 96px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            transition: 0.3s ease;
        }

        .subject-card:hover .card-icon {
            transform: scale(1.06) rotate(-3deg);
        }

        .subject-card .subject-name {
            font-size: 22px;
            font-weight: 700;
            color: #f1f5f9;
            transition: color 0.3s ease;
        }

        .subject-card .subject-desc {
            font-size: 14px;
            font-weight: 400;
            color: #94a3b8;
            margin-top: 6px;
            transition: color 0.3s ease;
        }

        /* ---------- FOOTER ---------- */
        .footer {
            text-align: center;
            margin-top: 48px;
            color: #475569;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        .footer span {
            color: #818cf8;
            font-weight: 500;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px 40px;
                border-radius: 32px;
            }

            .heading-section h1 {
                font-size: 32px;
            }

            .heading-section p {
                font-size: 15px;
            }

            .subject-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .subject-card {
                padding: 30px 16px 24px;
            }

            .card-icon {
                width: 72px;
                height: 72px;
                font-size: 38px;
            }

            .subject-card .subject-name {
                font-size: 18px;
            }

            .top-bar {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .top-bar-right {
                width: 100%;
                justify-content: flex-end;
            }
        }

        @media (max-width: 480px) {
            .subject-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .heading-section h1 {
                font-size: 26px;
            }

            .container {
                padding: 20px 14px 30px;
                border-radius: 24px;
            }

            .card-icon {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .subject-card .subject-name {
                font-size: 16px;
            }

            .subject-card {
                padding: 24px 12px 20px;
            }
        }

        /* ---------- LIGHT THEME ---------- */
        body.light-theme {
            background: linear-gradient(135deg, #e0e7ff 0%, #f0f4ff 50%, #fce4ec 100%);
        }

        body.light-theme .container {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.10), 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        body.light-theme .heading-section h1 {
            color: #1a1a2e;
        }
        body.light-theme .heading-section h1 .class-number {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.light-theme .heading-section h1 .subject-text {
            background: linear-gradient(135deg, #4f46e5, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.light-theme .heading-section p {
            color: #6b7280;
        }
        body.light-theme .heading-section .sub-badge {
            background: rgba(79, 70, 229, 0.12);
            color: #4f46e5;
        }

        body.light-theme .class-badge {
            background: rgba(79, 70, 229, 0.10);
            color: #4f46e5;
            border-color: rgba(79, 70, 229, 0.2);
        }

        body.light-theme .subject-card {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }

        body.light-theme .subject-card .subject-name {
            color: #1a1a2e;
        }
        body.light-theme .subject-card .subject-desc {
            color: #6b7280;
        }

        body.light-theme .subject-card[data-subject="science"] .card-icon { 
            background: #d1fae5; 
            color: #059669; 
        }

        body.light-theme .footer {
            color: #9ca3af;
        }
        body.light-theme .footer span {
            color: #4f46e5;
        }

        body.light-theme .back-btn {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
            color: #4b5563;
        }
        body.light-theme .back-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #1a1a2e;
        }

        body.light-theme .theme-toggle {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
            color: #1a1a2e;
        }
        body.light-theme .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== TOP BAR ===== -->
        <div class="top-bar">
            <div class="top-bar-left">
                <a href="main_page.html" class="back-btn">
                    ← Back
                </a>
                <span class="class-badge">Class 10</span>
            </div>
            <div class="top-bar-right">
                <button class="theme-toggle" id="themeToggle" title="Toggle Theme">☀️</button>
            </div>
        </div>

        <!-- ===== HEADING ===== -->
        <div class="heading-section">
            <div class="sub-badge">📚 Choose Your Subject</div>
            <h1>
                Class <span class="class-number">10</span> — 
                Choose <span class="subject-text">Subject</span>
            </h1>
            <p>Pick a subject to start learning</p>
        </div>

        <!-- ===== SUBJECT GRID (Sirf Science) ===== -->
        <div class="subject-grid">

            <!-- Science -->
            <a href="#" class="subject-card" data-subject="science">
                <div class="card-icon">🔬</div>
                <div class="subject-name">Science</div>
                <div class="subject-desc">Physics • Chemistry • Biology</div>
            </a>

            <!-- Baaki subjects baad mein add karenge -->
            <!-- 
            <a href="#" class="subject-card" data-subject="maths">
                <div class="card-icon">📐</div>
                <div class="subject-name">Mathematics</div>
                <div class="subject-desc">Algebra • Geometry • Stats</div>
            </a>

            <a href="#" class="subject-card" data-subject="english">
                <div class="card-icon">📖</div>
                <div class="subject-name">English</div>
                <div class="subject-desc">Literature • Grammar</div>
            </a>
            -->

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            — by <span>Sultan</span>
        </div>

    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ---------- THEME TOGGLE ----------
        const themeToggle = document.getElementById('themeToggle');
        let isDark = true;

        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            const body = document.body;

            if (isDark) {
                body.classList.remove('light-theme');
                themeToggle.textContent = '☀️';
            } else {
                body.classList.add('light-theme');
                themeToggle.textContent = '🌙';
            }
        });

        // ---------- SUBJECT CARD CLICK ----------
        document.querySelectorAll('.subject-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.preventDefault();
                const subject = card.getAttribute('data-subject');
                console.log(`📌 ${subject} selected — navigating to chapters...`);
                
                // Baad mein URL add karna:
                // window.location.href = `chapters.html?subject=${subject}`;
            });
        });
    </script>

</body>
</html>
