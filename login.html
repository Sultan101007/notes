<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Required</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
        }
        .login-container {
            width: 100%; max-width: 440px;
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            text-align: center;
        }
        .lock-icon { font-size: 56px; margin-bottom: 16px; display: block; }
        .login-container h1 { font-size: 28px; font-weight: 800; color: #f1f5f9; margin-bottom: 8px; }
        .login-container p { color: #94a3b8; font-size: 15px; margin-bottom: 24px; }
        .input-group { position: relative; margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; color: #94a3b8; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .input-group input {
            width: 100%; padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #f1f5f9; font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: 0.3s ease; outline: none;
        }
        .input-group input:focus { border-color: #818cf8; background: rgba(255, 255, 255, 0.08); }
        .input-group .toggle-visibility {
            position: absolute; right: 14px; bottom: 14px;
            background: none; border: none;
            color: #64748b; font-size: 18px;
            cursor: pointer; padding: 4px;
        }
        .input-group .toggle-visibility:hover { color: #94a3b8; }
        .login-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #818cf8, #7c3aed);
            border: none; border-radius: 14px;
            color: white; font-size: 17px; font-weight: 700;
            cursor: pointer; transition: 0.3s ease;
            font-family: 'Inter', sans-serif; margin-top: 8px;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(129, 140, 248, 0.25); }
        .error-msg { color: #f87171; font-size: 14px; margin-top: 14px; display: none; }
        .error-msg.show { display: block; }
        .footer-text { margin-top: 24px; color: #475569; font-size: 12px; }
        .footer-text span { color: #818cf8; }
        .admin-link { margin-top: 12px; font-size: 13px; }
        .admin-link a { color: #818cf8; text-decoration: none; font-weight: 600; }
        .admin-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <span class="lock-icon">🔐</span>
        <h1>Access Required</h1>
        <p>Enter your name and access code</p>

        <div class="input-group">
            <label for="userName">👤 Your Name</label>
            <input type="text" id="userName" placeholder="Enter your full name" autofocus />
        </div>

        <div class="input-group">
            <label for="accessCode">🔑 Access Code</label>
            <input type="password" id="accessCode" placeholder="Enter access code" maxlength="20" />
            <button class="toggle-visibility" id="toggleVisibility" type="button">👁️</button>
        </div>

        <button class="login-btn" id="loginBtn">🔓 Unlock</button>

        <div class="error-msg" id="errorMsg">❌ Invalid name or access code. Please try again.</div>

        <div class="admin-link">
            <a href="admin_login.html">🛡️ Admin Login</a>
        </div>

        <div class="footer-text">— by <span>Sultan</span></div>
    </div>

    <script>
        // ============================================================
        // 🔥 SHEET.BEST API - SIRF USERS SHEET
        // ============================================================
        const SHEET_BEST_URL = 'https://api.sheetbest.com/sheets/ef6dfc82-a0d0-4861-a343-c837c6b62dc7/0';

        const SESSION_DURATION = 24 * 60 * 60 * 1000;

        // ============================================================
        // 1. GET ALL DATA FROM USERS SHEET
        // ============================================================
        async function getSheetData() {
            try {
                const response = await fetch(SHEET_BEST_URL);
                return await response.json();
            } catch (e) {
                console.error('Error getting data:', e);
                return [];
            }
        }

        // ============================================================
        // 2. GET SETTINGS (Pehli row se)
        // ============================================================
        async function getSettings() {
            try {
                const data = await getSheetData();
                if (data && data.length > 0) {
                    // Pehli row = settings data
                    const firstRow = data[0];
                    return {
                        LoginCode: firstRow.LoginCode || '1234',
                        AdminCode: firstRow.AdminCode || 'admin123',
                        AdminName: firstRow.AdminName || 'Sultan'
                    };
                }
                return { LoginCode: '1234', AdminCode: 'admin123', AdminName: 'Sultan' };
            } catch (e) {
                console.error('Error getting settings:', e);
                return { LoginCode: '1234', AdminCode: 'admin123', AdminName: 'Sultan' };
            }
        }

        // ============================================================
        // 3. ADD/UPDATE USER
        // ============================================================
        async function addUser(name) {
            try {
                const data = await getSheetData();
                const existingUser = data.find(row => row.Name?.toLowerCase() === name.toLowerCase());

                // Get settings from first row
                const settings = await getSettings();

                if (!existingUser) {
                    // Naya user - first row settings ke saath, second row se users start
                    // We'll append new user at the end
                    await fetch(SHEET_BEST_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            Name: name.trim(),
                            LoginTime: new Date().toISOString(),
                            IsAdmin: 'FALSE',
                            LoginCode: settings.LoginCode,
                            AdminCode: settings.AdminCode,
                            AdminName: settings.AdminName
                        })
                    });
                    console.log('✅ New user added:', name);
                } else {
                    // Update existing user's login time
                    // We'll add a new row with updated time (simpler)
                    await fetch(SHEET_BEST_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            Name: name.trim(),
                            LoginTime: new Date().toISOString(),
                            IsAdmin: existingUser.IsAdmin || 'FALSE',
                            LoginCode: settings.LoginCode,
                            AdminCode: settings.AdminCode,
                            AdminName: settings.AdminName
                        })
                    });
                    console.log('🔄 User login time updated:', name);
                }
                return true;
            } catch (e) {
                console.error('Error adding user:', e);
                return false;
            }
        }

        // ============================================================
        // 4. LOGIN
        // ============================================================
        const loginBtn = document.getElementById('loginBtn');
        const nameInput = document.getElementById('userName');
        const accessInput = document.getElementById('accessCode');
        const errorMsg = document.getElementById('errorMsg');

        async function attemptLogin() {
            const name = nameInput.value.trim();
            const code = accessInput.value.trim();

            if (!name) {
                errorMsg.textContent = '⚠️ Please enter your name.';
                errorMsg.classList.add('show');
                nameInput.focus();
                return;
            }

            if (!code) {
                errorMsg.textContent = '⚠️ Please enter the access code.';
                errorMsg.classList.add('show');
                accessInput.focus();
                return;
            }

            const settings = await getSettings();
            
            // Debug - check what settings we got
            console.log('📋 Settings loaded:', settings);

            if (code !== settings.LoginCode) {
                errorMsg.textContent = '❌ Invalid access code. Please try again.';
                errorMsg.classList.add('show');
                accessInput.value = '';
                accessInput.focus();
                setTimeout(() => {
                    errorMsg.classList.remove('show');
                }, 3000);
                return;
            }

            await addUser(name);

            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('loginTime', Date.now());
            localStorage.setItem('userName', name);

            if (name.toLowerCase() === settings.AdminName?.toLowerCase()) {
                localStorage.setItem('isAdmin', 'true');
                console.log('👑 Admin logged in:', name);
            } else {
                localStorage.setItem('isAdmin', 'false');
                console.log('👤 User logged in:', name);
            }

            nameInput.value = '';
            accessInput.value = '';

            window.location.href = 'main_page.html';
        }

        loginBtn.addEventListener('click', attemptLogin);
        accessInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptLogin();
        });

        // ============================================================
        // 5. TOGGLE VISIBILITY
        // ============================================================
        const toggleBtn = document.getElementById('toggleVisibility');
        let isVisible = false;

        toggleBtn.addEventListener('click', () => {
            isVisible = !isVisible;
            accessInput.type = isVisible ? 'text' : 'password';
            toggleBtn.textContent = isVisible ? '🙈' : '👁️';
        });

        // ============================================================
        // 6. AUTO-LOGIN CHECK
        // ============================================================
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const loginTimeCheck = parseInt(localStorage.getItem('loginTime') || '0');

        if (isLoggedIn && (Date.now() - loginTimeCheck) < SESSION_DURATION) {
            const userName = localStorage.getItem('userName');
            if (userName) {
                window.location.href = 'main_page.html';
            }
        }

        console.log('🔐 Sheet.best Login System Active');
        console.log('📌 Default Login Code: 1234');
        console.log('📊 Using only users sheet');
    </script>

</body>
</html>
